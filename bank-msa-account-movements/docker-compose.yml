services:
  postgres:
    image: postgres:15-alpine
    container_name: banco-postgres
    environment:
      POSTGRES_DB: banco_db
      POSTGRES_USER: banco_user
      POSTGRES_PASSWORD: banco_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco_user -d banco_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banco-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banco-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: banco_db
      DB_USER: banco_user
      DB_PASSWORD: banco_pass
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banco-network

volumes:
  postgres_data:

networks:
  banco-network:
    driver: bridge
